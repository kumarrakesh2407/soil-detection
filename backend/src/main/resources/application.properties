# Server Configuration
server.port=8082

# Spring AI Configuration
spring.ai.openai.api-key=sk-abcdijkl1234uvwxabcdijkl1234uvwxabcdijkl
spring.ai.openai.chat.options.model=gpt-4-vision-preview
spring.ai.openai.chat.options.max-tokens=1500
spring.ai.openai.chat.options.temperature=0.1

# Database Configuration
spring.datasource.url=jdbc:h2:mem:soildetection
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500,http://localhost:63342,http://127.0.0.1:63342
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
